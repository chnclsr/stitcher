<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stitcher object guidance request</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root { --paper: #fff7ec; --ink: #202a45; --muted: #59647a; --soft: #626b7d; --line: #d8d2c8; --accent: #c24739; --link: #3658d9; --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', Georgia, serif; --mono: 'Geist Mono', ui-monospace, monospace; }
    body { margin: 0; padding: 40px; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    main { width: min(100%, 1120px); margin: auto; }
    .eyebrow { margin: 0 0 8px; color: var(--muted); font: 500 8px var(--mono); letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0 0 20px; font: 400 30px/1.15 var(--serif); letter-spacing: -.02em; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 960px; }
    @media print { .diagram-container { overflow: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Request sequence · optional object guidance</p>
    <h1>Tell Stitcher what to keep</h1>
    <div class="diagram-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="object-guidance-title object-guidance-desc">
        <title id="object-guidance-title">Stitcher object guidance sequence</title>
        <desc id="object-guidance-desc">The user can describe the target object. Stitcher sends the photo and optional target to its proxy, which securely calls fal and returns a transparent PNG.</desc>
        <defs>
          <marker id="request" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#3658d9"/></marker>
          <marker id="response" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#626b7d"/></marker>
          <marker id="success" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#c24739"/></marker>
        </defs>
        <rect width="960" height="600" fill="#fff7ec"/>

        <!-- Lifelines and message arrows. -->
        <g fill="none" stroke-linecap="round">
          <line x1="120" y1="112" x2="120" y2="540" stroke="#69649e" stroke-width="1" stroke-dasharray="4 5"/>
          <line x1="360" y1="112" x2="360" y2="540" stroke="#69649e" stroke-width="1" stroke-dasharray="4 5"/>
          <line x1="600" y1="112" x2="600" y2="540" stroke="#69649e" stroke-width="1" stroke-dasharray="4 5"/>
          <line x1="840" y1="112" x2="840" y2="540" stroke="#69649e" stroke-width="1" stroke-dasharray="4 5"/>
          <path d="M120 148H360" stroke="#59647a" stroke-width="1.4" marker-end="url(#request)"/>
          <path d="M120 184H360" stroke="#c24739" stroke-width="1.6" marker-end="url(#success)"/>
          <path d="M360 220H600" stroke="#3658d9" stroke-width="1.6" marker-end="url(#request)"/>
          <path d="M600 256H840" stroke="#3658d9" stroke-width="1.4" marker-end="url(#request)"/>
          <path d="M840 292H600" stroke="#626b7d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#response)"/>
          <path d="M600 328H840" stroke="#3658d9" stroke-width="1.4" marker-end="url(#request)"/>
          <path d="M840 364H600" stroke="#626b7d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#response)"/>
          <path d="M600 400H840" stroke="#3658d9" stroke-width="1.4" marker-end="url(#request)"/>
          <path d="M840 436H600" stroke="#626b7d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#response)"/>
          <path d="M600 472H360" stroke="#626b7d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#response)"/>
          <path d="M360 508H120" stroke="#626b7d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#response)"/>
        </g>

        <!-- Activation bars. -->
        <g fill="#3658d9" fill-opacity=".08" stroke="#69649e" stroke-width="1">
          <rect x="356" y="148" width="8" height="72" rx="3"/>
          <rect x="596" y="220" width="8" height="252" rx="3"/>
          <rect x="836" y="256" width="8" height="36" rx="3"/>
          <rect x="836" y="328" width="8" height="36" rx="3"/>
          <rect x="836" y="400" width="8" height="36" rx="3"/>
          <rect x="356" y="472" width="8" height="36" rx="3"/>
        </g>

        <!-- Opaque label masks float above each message. -->
        <g font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing=".02em">
          <rect x="140" y="128" width="200" height="14" rx="3" fill="#fff7ec"/><text x="240" y="138" fill="#59647a">capture or choose photo</text>
          <rect x="145" y="164" width="190" height="14" rx="3" fill="#fff7ec"/><text x="240" y="174" fill="#c24739">describe target · optional</text>
          <rect x="477" y="200" width="126" height="14" rx="3" fill="#fff7ec"/><text x="540" y="210" fill="#3658d9">photo + targetObject?</text>
          <rect x="667" y="236" width="106" height="14" rx="3" fill="#fff7ec"/><text x="720" y="246" fill="#3658d9">upload image</text>
          <rect x="680" y="272" width="80" height="14" rx="3" fill="#fff7ec"/><text x="720" y="282" fill="#626b7d">image URL</text>
          <rect x="654" y="308" width="132" height="14" rx="3" fill="#fff7ec"/><text x="720" y="318" fill="#3658d9">infer + optional prompt</text>
          <rect x="667" y="344" width="106" height="14" rx="3" fill="#fff7ec"/><text x="720" y="354" fill="#626b7d">result image URL</text>
          <rect x="680" y="380" width="80" height="14" rx="3" fill="#fff7ec"/><text x="720" y="390" fill="#3658d9">download PNG</text>
          <rect x="654" y="416" width="132" height="14" rx="3" fill="#fff7ec"/><text x="720" y="426" fill="#626b7d">transparent PNG bytes</text>
          <rect x="482" y="452" width="116" height="14" rx="3" fill="#fff7ec"/><text x="540" y="462" fill="#626b7d">image/png response</text>
          <rect x="171" y="488" width="138" height="14" rx="3" fill="#fff7ec"/><text x="240" y="498" fill="#626b7d">preview · save · share</text>
        </g>

        <!-- Participants sit above connectors. -->
        <g font-family="'Geist', system-ui, sans-serif" text-anchor="middle">
          <g><rect x="40" y="68" width="160" height="44" rx="8" fill="#fffdf8" stroke="#d8d2c8"/><text x="120" y="88" fill="#202a45" font-size="13" font-weight="600">Creator</text><text x="120" y="102" fill="#626b7d" font-size="9">camera or gallery</text></g>
          <g><rect x="280" y="68" width="160" height="44" rx="8" fill="#efedff" stroke="#69649e"/><text x="360" y="88" fill="#202a45" font-size="13" font-weight="600">Stitcher app</text><text x="360" y="102" fill="#59647a" font-size="9">React · Capacitor</text></g>
          <g><rect x="520" y="68" width="160" height="44" rx="8" fill="#fffdf8" stroke="#d8d2c8"/><text x="600" y="88" fill="#202a45" font-size="13" font-weight="600">Secure proxy</text><text x="600" y="102" fill="#626b7d" font-size="9">Node.js · Express</text></g>
          <g><rect x="760" y="68" width="160" height="44" rx="8" fill="#fffdf8" stroke="#d8d2c8"/><text x="840" y="88" fill="#202a45" font-size="13" font-weight="600">fal · Bria</text><text x="840" y="102" fill="#626b7d" font-size="9">storage + cutout model</text></g>
        </g>

        <!-- Compact bottom legend and key security note. -->
        <g font-family="'Geist Mono', ui-monospace, monospace" font-size="8" fill="#59647a">
          <line x1="48" y1="554" x2="90" y2="554" stroke="#3658d9" stroke-width="1.4" marker-end="url(#request)"/><text x="102" y="557">request</text>
          <line x1="188" y1="554" x2="230" y2="554" stroke="#626b7d" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#response)"/><text x="242" y="557">response</text>
          <line x1="352" y1="546" x2="394" y2="546" stroke="#c24739" stroke-width="1.6" marker-end="url(#success)"/><text x="406" y="557">optional target hint</text>
          <text x="912" y="557" text-anchor="end" fill="#626b7d">FAL_KEY stays on the proxy</text>
        </g>
        <line x1="40" y1="574" x2="920" y2="574" stroke="#e1d8ca" stroke-width="1"/>
      </svg>
    </div>
  </main>
</body>
</html>
